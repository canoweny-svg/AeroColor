# Cross-platform CI: builds VST3 + Standalone (+ AU on macOS), runs the DSP
# core tests and the plugin-hosting smoke test on every OS.
# AAX is not built in CI (needs the Avid SDK + PACE signing; see README).
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: no -G, CMake picks the newest Visual Studio on the runner
          - { os: windows-latest, cmake_args: "-A x64" }
          # Intel macOS image: its queue is far shorter than the Apple Silicon one.
          # Still builds a Universal binary (arm64 + x86_64) via CMAKE_OSX_ARCHITECTURES.
          - { os: macos-15-intel, cmake_args: "-G Xcode" }
          - { os: ubuntu-latest,  cmake_args: "-G Ninja" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxext-dev libxcomposite-dev \
            libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake_args }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: DSP core tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host smoke test (VST3)
        shell: bash
        run: |
          HOST=$(find build -type f \( -name AeroSoundHostTest -o -name AeroSoundHostTest.exe \) -path "*Release*" | head -1)
          VST3=$(find build -type d -name "AEROSOUND.vst3" -path "*Release*" | head -1)
          echo "host=$HOST vst3=$VST3"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$HOST" "$VST3"; else "$HOST" "$VST3"; fi

      - name: Host smoke test (AU, macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          AU=$(find build -type d -name "AEROSOUND.component" -path "*Release*" | head -1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components && cp -R "$AU" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aufx AeSd AeSn
          HOST=$(find build -type f -name AeroSoundHostTest -path "*Release*" | head -1)
          "$HOST" ~/Library/Audio/Plug-Ins/Components/"AEROSOUND.component"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: AEROSOUND-${{ runner.os }}
          path: build/AeroSound_artefacts/

      # ---------------- installers (one per OS) ----------------
      - name: Installer (Windows setup.exe)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DArtefacts="$PWD\build\AeroSound_artefacts\Release" /DVersion=1.0.0 packaging\windows\AeroSound.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\windows

      - name: Installer (macOS .pkg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/make_pkg.sh build/AeroSound_artefacts/Release 1.0.0

      - name: Installer (Linux .deb + .tar.gz)
        if: runner.os == 'Linux'
        run: |
          bash packaging/linux/make_packages.sh build/AeroSound_artefacts/Release 1.0.0
          sudo dpkg -i dist/linux/aerosound_1.0.0_amd64.deb
          xvfb-run -a "$(find build -type f -name AeroSoundHostTest -path '*Release*' | head -1)" /usr/lib/vst3/AEROSOUND.vst3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AEROSOUND-Installer-${{ runner.os }}
          path: dist/
